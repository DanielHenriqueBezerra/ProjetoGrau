<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dia das Mães - Grau Técnico</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(135deg,#0a5524,#3a9a55);
  color: white;
}

.video-grid {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.video-card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.video-card:hover {
  transform: translateY(-5px);
}

video {
  width: 100%;
  height: 250px;
  object-fit: cover;
  background: #000;
  display: block;
}
</style>
</head>

<body>

<header>
<h1>Homenagem ao Dia das Mães</h1>
<p>Grau Técnico</p>
</header>

<section class="video-grid" id="video-grid"></section>

<script>
const videos = [
  'videos/video1.mp4',
];

const grid = document.getElementById("video-grid");

let currentVideo = null;

videos.forEach(src => {
  const card = document.createElement("div");
  card.className = "video-card";

  card.innerHTML = `
    <video muted loop playsinline preload="metadata">
      <source src="${src}" type="video/mp4">
    </video>
  `;

  const video = card.querySelector("video");

  function playVideo() {
    // pausa outro vídeo
    if (currentVideo && currentVideo !== video) {
      currentVideo.pause();
      currentVideo.currentTime = 0;
    }

    currentVideo = video;

    // CORREÇÃO PRINCIPAL (evita DOMException)
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {});
    }
  }

  function stopVideo() {
    video.pause();
    video.currentTime = 0;

    if (currentVideo === video) {
      currentVideo = null;
    }
  }

  // 💻 Desktop
  card.addEventListener("mouseenter", playVideo);
  card.addEventListener("mouseleave", stopVideo);

  // 📱 Mobile
  card.addEventListener("click", () => {
    if (video.paused) playVideo();
    else stopVideo();
  });

  grid.appendChild(card);
});
</script>

</body>
</html>
