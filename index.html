<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dia das Mães - Grau Técnico</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: 'Source Sans Pro', sans-serif;
  background: #fff;
  color: #042d13;
}

/* HERO */
.hero {
  background: linear-gradient(135deg,#0a5524,#3a9a55);
  padding: 60px 20px;
  text-align: center;
  color: white;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
}

.hero p {
  margin-top: 10px;
}

/* VIDEOS */
.video-grid {
  max-width: 1100px;
  margin: auto;
  padding: 50px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.video-card {
  background: #fff;
  border: 1px solid #d5ebda;
  border-radius: 12px;
  overflow: hidden;
}

video {
  width: 100%;
  height: 250px;
  object-fit: cover;
  background: #000;
  display: block;
}

/* FOOTER */
footer {
  background: #042d13;
  color: white;
  text-align: center;
  padding: 30px;
}
</style>
</head>

<body>

<header class="hero">
  <h1>Homenagem ao Dia das Mães</h1>
  <p>Grau Técnico</p>
</header>

<section class="video-grid" id="videoGrid"></section>

<footer>
  <h2>Feliz Dia das Mães ❤️</h2>
  <p>Com carinho, Grau Técnico</p>
</footer>

<script>
const videos = [
  'videos/video1.mp4',
  'videos/video2.mp4',
  'videos/video3.mp4',
  'videos/video4.mp4',
  'videos/video5.mp4',
  'videos/video6.mp4',
  'videos/video7.mp4'
];

const grid = document.getElementById("videoGrid");

let currentVideo = null;

videos.forEach(src => {
  const card = document.createElement("div");
  card.className = "video-card";

  card.innerHTML = `
    <video muted loop playsinline preload="metadata">
      <source src="${src}" type="video/mp4">
    </video>
  `;

  const video = card.querySelector("video");

  function playVideo() {
    if (currentVideo && currentVideo !== video) {
      currentVideo.pause();
      currentVideo.currentTime = 0;
    }

    currentVideo = video;

    video.play().catch(() => {});
  }

  function stopVideo() {
    video.pause();
    video.currentTime = 0;
    if (currentVideo === video) currentVideo = null;
  }

  card.addEventListener("mouseenter", playVideo);
  card.addEventListener("mouseleave", stopVideo);

  card.addEventListener("click", () => {
    if (video.paused) playVideo();
    else stopVideo();
  });

  grid.appendChild(card);
});
</script>

</body>
</html>
