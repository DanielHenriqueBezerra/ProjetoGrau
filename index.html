<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dia das Mães - Grau Técnico</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
}

header {
  background: linear-gradient(135deg,#0a5524,#3a9a55);
  color: white;
  text-align: center;
  padding: 60px 20px;
}

header h1 {
  margin: 0;
}

.video-grid {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.video-card {
  border: 1px solid #d5ebda;
  border-radius: 10px;
  overflow: hidden;
  background: #000;
}

video {
  width: 100%;
  height: 250px;
  object-fit: cover;
  display: block;
  background: black;
}
.error {
  color: red;
  font-size: 14px;
  padding: 10px;
  background: #fff;
}
</style>
</head>

<body>

<header>
  <h1>Homenagem ao Dia das Mães</h1>
  <p>Grau Técnico</p>
</header>

<section class="video-grid" id="grid"></section>

<script>
const videos = [
  'videos/video1.mp4',
  'video2.mp4',
  'videos/video3.mp4',
  'videos/video4.mp4',
  'videos/video5.mp4',
  'videos/video6.mp4',
  'videos/video7.mp4'
];

const grid = document.getElementById("grid");

let current = null;

videos.forEach((src, index) => {
  const card = document.createElement("div");
  card.className = "video-card";

  card.innerHTML = `
    <video muted playsinline preload="metadata">
      <source src="${src}" type="video/mp4">
    </video>
    <div class="error" id="err-${index}" style="display:none;"></div>
  `;

  const video = card.querySelector("video");
  const errorBox = card.querySelector(".error");

  // 🔴 ERRO VISÍVEL (AGORA VOCÊ SABE SE NÃO CARREGAR)
  video.addEventListener("error", () => {
    errorBox.style.display = "block";
    errorBox.textContent = "❌ Vídeo não encontrado: " + src;
  });

  function playVideo() {
    if (current && current !== video) {
      current.pause();
      current.currentTime = 0;
    }
    current = video;

    const p = video.play();
    if (p !== undefined) {
      p.catch(() => {});
    }
  }

  function stopVideo() {
    video.pause();
    video.currentTime = 0;
    if (current === video) current = null;
  }

  // PC
  card.addEventListener("mouseenter", playVideo);
  card.addEventListener("mouseleave", stopVideo);

  // MOBILE
  card.addEventListener("click", () => {
    if (video.paused) playVideo();
    else stopVideo();
  });

  grid.appendChild(card);
});
</script>

</body>
</html>
