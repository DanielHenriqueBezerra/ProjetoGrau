<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dia das Mães - Grau Técnico</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
html, body { height: 100%; margin: 0; }
.font-heading { font-family: 'Playfair Display', Georgia, serif; }
.font-body { font-family: 'Source Sans 3', sans-serif; }

/* animações e estilos mantidos */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-fade-up { animation: fadeUp 0.8s ease-out both; }

.video-card {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.video-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,80,40,0.12);
}
</style>
</head>

<body class="h-full font-body" style="background-color: #ffffff;">

<header class="text-center py-20" style="background: linear-gradient(135deg,#0a5524,#3a9a55); color:white;">
<h1 class="font-heading text-5xl font-bold">Homenagem ao Dia das Mães</h1>
<p class="mt-4">O Grau Técnico celebra o amor, a força e a dedicação de todas as mães.</p>
<a href="#videos" class="mt-6 inline-block bg-white text-green-900 px-6 py-3 rounded-full">Assistir vídeos</a>
</header>

<section id="videos" class="max-w-6xl mx-auto p-6">
<h2 class="text-3xl font-heading text-center mb-10">Mensagens Especiais</h2>

<div id="video-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</section>

<footer class="text-center py-10" style="background:#042d13;color:white;">
<p class="text-2xl font-heading">Feliz Dia das Mães ❤️</p>
<p class="text-sm mt-2">Com carinho, Grau Técnico</p>
</footer>

<script>
const videos = [
  "video1.mp4",
  "video2.mp4",
  "video3.mp4",
  "video4.mp4",
  "video5.mp4",
  "video6.mp4",
  "video7.mp4"
];

const grid = document.getElementById("video-grid");

videos.forEach(src => {
  const div = document.createElement("div");
  div.className = "video-card bg-white rounded-xl overflow-hidden";

  div.innerHTML = `
    <video controls style="width:100%; height:250px; object-fit:cover; background:#000">
      <source src="${src}" type="video/mp4">
      Seu navegador não suporta vídeo.
    </video>
  `;

  grid.appendChild(div);
});

/* evita erro se lucide não carregar */
if (window.lucide) {
  lucide.createIcons();
}
</script>

</body>
</html>
